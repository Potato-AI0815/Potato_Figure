name: potato-figure-audit
display_name: Potato Figure Audit
version: 0.4.3-alpha
packaging_revision: R6.1
release_status: pre-release
description: >
  Independent scientific figure audit and integrity layer for biomedical
  research. Covers statistical-unit integrity, claim-evidence alignment,
  panel architecture, global coherence, visual QA, and reproducible
  delivery. Audit only — does not generate, render, or redraw figures.
  Works with any figure generator (R, Python, GraphPad Prism,
  Nature-Figure, Illustrator, AI).
positioning: independent_audit_layer
generator_agnostic: true
requires_nature: false
audit_layers:
  - input
  - scientific_integrity
  - statistical_consistency
  - claim_evidence
  - panel_architecture
  - global_coherence
  - visual_integrity
  - color_system
  - delivery_reproducibility
  - publication_readiness
severity: [BLOCKER, MAJOR, MINOR, INFO]
entrypoint: scripts/audit_figure.R
outputs:
  - figure_audit_report.md
  - figure_audit.json
tests:
  r1_regression: tests/run_tests.R
  r4_regression: tests/run_r4_tests.R
  audit_tests: tests/run_audit_tests.R
  color_behavioral_tests: tests/run_color_system_tests.R
  r6_gate_semantics_tests: tests/run_r6_tests.R
  r6_real_regression: tests/run_r6_real_regression.R
  warning_semantics_tests: tests/run_warning_semantics_tests.R
  raster_security_tests: tests/run_raster_security_tests.R
  main_entry_tests: tests/run_main_entry_tests.R
  visual_correction_tests: tests/run_visual_correction_tests.R
release_validation:
  runner: scripts/run_release_validation.R
  single_source_of_truth: validation/latest_validation.json
  report_generator: scripts/generate_validation_report.R
  generated_reports: [TEST_MATRIX.tsv, RUNTIME_VALIDATION_REPORT.md]
legacy_helpers:
  - themes/potato_theme_v02.R
  - references/visual-art-direction.md
  - references/layout-candidate-selection.md
license: MIT
