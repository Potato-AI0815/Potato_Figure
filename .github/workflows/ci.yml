name: Release validation CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Package + release validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Checkout into a skill-named directory so the packaging validator's
          # SKILL_NAME_DIRECTORY_MATCH check runs against the approved layout
          # (repo name Potato_Figure is the repository, the skill is
          # potato-figure-audit).
          path: potato-figure-audit

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: potato-figure-audit
          cache: always
          extra-packages: |
            any::jsonlite
            any::ggplot2
            any::patchwork
            any::reshape2
            any::survival

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --quiet Pillow numpy

      - name: Static packaging validator
        working-directory: potato-figure-audit
        run: python scripts/validate_skill_package.py .

      - name: Run full release validation (11 suites)
        working-directory: potato-figure-audit
        shell: bash
        run: Rscript scripts/run_release_validation.R .

      - name: Raster environment diagnostics
        if: always()
        working-directory: potato-figure-audit
        shell: bash
        run: |
          which -a python python3 || true
          echo "PATH=$PATH"
          python -c "import PIL, numpy; print('PIL', PIL.__version__, 'numpy', numpy.__version__)" 2>&1
          echo "PROBE_EXIT=$?"
          python scripts/raster_measure.py metrics tests/regression_three_tier/B_workflow/figure.png --ink-threshold 20 --panel-count 2 2>&1
          echo "RASTER_EXIT=$?"

      - name: Dump suite logs (diagnostic)
        if: always()
        working-directory: potato-figure-audit
        shell: bash
        run: |
          for f in validation/run_logs/*.stdout.log; do
            echo "===== $f ====="
            tail -80 "$f"
          done
          for f in validation/run_logs/*.stderr.log; do
            if [ -s "$f" ]; then echo "===== $f (stderr) ====="; tail -40 "$f"; fi
          done

      - name: Machine-readable release gate on validation/latest_validation.json
        working-directory: potato-figure-audit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(Path("validation/latest_validation.json").read_text(encoding="utf-8"))
          assert d.get("version") == "0.4.3-alpha", d.get("version")
          assert d.get("overall") == "PASS", d.get("overall")
          t = d["totals"]
          assert t["suites"] == 11 and t["suites_pass"] == 11, t
          assert t["checks_total"] == 177 and t["checks_pass"] == 177, t
          failed = [s["name"] for s in d["suites"] if s["status"] != "PASS"]
          assert not failed, failed
          print(f"RELEASE_GATE: version={d['version']} overall={d['overall']} "
                f"suites={t['suites_pass']}/{t['suites']} checks={t['checks_pass']}/{t['checks_total']} -> PASS")
          PY
