name: R figure workflow smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/r-smoke-test.yml"
  pull_request:
    paths:
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/r-smoke-test.yml"

permissions:
  contents: read

concurrency:
  group: r-figure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Run worked example + QA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: always
          extra-packages: |
            any::ggplot2
            any::patchwork
            any::svglite
            any::ragg
            any::png

      - name: Run worked example (four-format export + source data + manifest)
        working-directory: examples
        run: Rscript example_usage.R

      - name: Verify four-format outputs exist
        working-directory: examples
        run: |
          for f in example_output/example_figure.pdf \
                   example_output/example_figure.svg \
                   example_output/example_figure.tiff \
                   example_output/example_figure.png \
                   example_output/figure_manifest.tsv \
                   example_output/panel1_data.tsv \
                   example_output/panel2_data.tsv \
                   example_output/panel3_data.tsv; do
            test -s "$f" && echo "OK  $f" || { echo "MISSING $f"; exit 1; }
          done

      - name: Run static preflight (validate_figure.R)
        working-directory: scripts
        run: Rscript validate_figure.R ../examples/example_output

      - name: Run physical-size QA (qa_physical_size.R)
        working-directory: scripts
        run: Rscript qa_physical_size.R ../examples/example_output
